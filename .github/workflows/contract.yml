# Checks that this repository still matches the backend integration docs (contract server-integration-v4): the
# manifest and regions, node --test (every row of the in-process mapping, mocked), the CSS build, the shared contract
# test with the AI off and with the AI stub and every switch on, the smoke test and the shared browser tests. Run
# Server-Side Workflows run in this app, so nothing needs Docker except the image job, which builds and starts the image.
name: Contract

on:
  push:
    branches: [master]
  pull_request:

jobs:
  contract:
    name: Node 26 on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm

      - run: npm ci

      - name: Manifest, regions, shared/ and versions
        run: npm run check -- --complete

      - name: node --test
        run: npm test

      - name: The committed CSS is the build's output
        run: |
          npm run css
          git diff --exit-code public/css/site.css

      - name: Contract test, AI off
        run: npm run contract
        env:
          AI: "off"

      - name: Contract test, AI stub and every switch on
        run: npm run contract
        env:
          AI: stub
          VALIDATE_RESPONSES: "true"
          LINT_DEFINITIONS: "true"
          DEMO_MODE: "true"

      - name: Smoke test
        run: npm run contract -- --smoke

      # host.js and page-tabs.js in a real browser: what node --test and the contract test never run
      - name: Browser tests (Chromium)
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  matrix:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: "24" }
          - { os: windows-latest, node: "26" }   # the process handling: free ports, kill(), no signals
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Contract test, AI stub
        run: npm run contract
        env:
          AI: stub

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the image alone
        run: |
          docker build -t surveyjs-nodejs .
          docker run -d --name app -p 8000:8000 surveyjs-nodejs

      - name: It answers /up
        run: curl -sf --retry 30 --retry-delay 1 --retry-all-errors http://127.0.0.1:8000/up

      - name: Behind a TLS proxy it uses https and wss
        run: |
          page=$(curl -sf -H 'X-Forwarded-Proto: https' http://127.0.0.1:8000/examples/fill-together)
          echo "$page" | grep -q '<link rel="canonical" href="https://127.0.0.1:8000/examples/fill-together">'
          echo "$page" | grep -q '"url":"wss://127.0.0.1:8000"'

      - name: Production mode, and sharp loads
        run: |
          test "$(docker exec app node -e 'console.log(process.env.NODE_ENV)')" = production
          docker exec app node -e "import('sharp').then(() => console.log('sharp ok'))"

      - name: Logs
        if: failure()
        run: docker logs app
